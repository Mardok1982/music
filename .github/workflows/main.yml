name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila APK
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts NON trovato. File presenti nel repository:"
            find . -not -path './.git/*' | head -100
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Progetto trovato in: $DIR"
          cd "$DIR"
          gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Musica-apk
          path: "**/app/build/outputs/apk/release/*.apk"
